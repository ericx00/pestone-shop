---
deployment:
  tasks:
    # Repo is cloned to /home/pestonec/repositories/pestone-shop
    # The live app runs from /home/pestonec/pestone-shop (its /public is the domain document root).
    - export APP_DIR=/home/pestonec/pestone-shop
    - export REPO_DIR=/home/pestonec/repositories/pestone-shop
    - export COMPOSER=$(command -v composer || echo /opt/cpanel/composer/bin/composer)
    - export PHP=$(command -v php)

    - /bin/mkdir -p "$APP_DIR"
    # Sync code, keeping runtime dirs, .env and uploaded storage on the server
    - /usr/bin/rsync -a --delete
        --exclude '.git'
        --exclude '.env'
        --exclude '/storage'
        --exclude '/public/storage'
        --exclude '/public/build'
        --exclude '/node_modules'
        "$REPO_DIR/" "$APP_DIR/"

    # Ship the pre-built front-end assets from the repo (built in CI or committed)
    - /bin/cp -R "$REPO_DIR/public/build" "$APP_DIR/public/build"

    - cd "$APP_DIR" && "$PHP" "$COMPOSER" install --no-dev --prefer-dist --optimize-autoloader --no-interaction
    - cd "$APP_DIR" && "$PHP" artisan storage:link || true
    - cd "$APP_DIR" && "$PHP" artisan migrate --force
    - cd "$APP_DIR" && "$PHP" artisan optimize:clear
    - cd "$APP_DIR" && "$PHP" artisan config:cache
    - cd "$APP_DIR" && "$PHP" artisan route:cache
    - cd "$APP_DIR" && "$PHP" artisan view:cache
    - cd "$APP_DIR" && "$PHP" artisan filament:optimize || true
    - cd "$APP_DIR" && "$PHP" artisan queue:restart || true
