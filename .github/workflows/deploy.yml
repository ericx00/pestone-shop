name: Deploy to cPanel (FTP)

# push to main -> FTP-sync the app + web root to cPanel, then trigger
# migrate/seed/cache via the token-protected /deploy/{token} route.
# No SSH, no cPanel Git Version Control, no terminal needed on the host.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   FTP_HOST          e.g. ftp.pestone.co.ke  (or the server hostname/IP cPanel shows)
#   FTP_USERNAME      the FTP account's username
#   FTP_PASSWORD      the FTP account's password
#   FTP_APP_DIR       e.g. /pestone-shop        (absolute path from the FTP account's root)
#   FTP_WEBROOT_DIR   e.g. /public_html
# Optional:
#   DEPLOY_URL        e.g. https://pestone.co.ke/deploy/<DEPLOY_TOKEN>
#                     (leave unset until you've created .env with a DEPLOY_TOKEN)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the web root (assets + front-controller shim)
        run: |
          rm -rf _webroot
          cp -r public _webroot
          cp deploy/public_html-index.php _webroot/index.php

      - name: FTP sync — application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_APP_DIR }}/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/_webroot/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**

      - name: FTP sync — web root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_WEBROOT_DIR }}/
          local-dir: ./_webroot/
          exclude: |
            **/storage/**

      - name: Run migrate / seed / cache
        run: curl -fsS "${{ secrets.DEPLOY_URL }}" || echo "Skipped — DEPLOY_URL not set yet, or the app isn't reachable yet (expected before .env exists on the server)."
