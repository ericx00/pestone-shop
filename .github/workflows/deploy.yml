name: Deploy to cPanel (FTP + PHP extractor)

# push to main -> zip the app + web root -> FTP-upload just those 2 zips
# (+ a tiny extractor script) into public_html -> hit a URL so PHP's
# ZipArchive unpacks them on the server -> hit /deploy/{token} to
# migrate/seed/cache. No terminal, no SSH, no cPanel Git, no per-file FTP
# (that was hours-long for ~14k vendor files; this is 2 small file
# uploads + a few seconds of server-side extraction).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   FTP_HOST        e.g. ftp.pestone.co.ke
#   FTP_USERNAME    the FTP account's username (rooted at the account home)
#   FTP_PASSWORD    the FTP account's password
#   DEPLOY_TOKEN    same value you put in the server's .env DEPLOY_TOKEN=
#                   generate with: php -r "echo bin2hex(random_bytes(24));"
# Optional:
#   APP_BASE_URL    e.g. https://pestone.co.ke  (default used if unset)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the two deploy archives + extractor script
        run: |
          set -e
          mkdir -p _payload

          # App: everything except VCS/CI cruft, tests, .env, and the public/
          # folder's own copy (public/ ships separately as the web-root zip).
          zip -r -q _payload/_deploy_app.zip . \
            -x '.git/*' -x '.github/*' -x 'node_modules/*' -x 'tests/*' \
            -x '_payload/*' -x '.env' -x 'deploy/_deploy.php.template'

          # Web root: contents of public/ at top level, with the shim as index.php.
          rm -rf _webroot && cp -r public _webroot
          cp deploy/public_html-index.php _webroot/index.php
          (cd _webroot && zip -r -q ../_payload/_deploy_webroot.zip .)

          # Extractor script, with the real token baked in.
          sed "s#__DEPLOY_TOKEN__#${{ secrets.DEPLOY_TOKEN }}#" \
            deploy/_deploy.php.template > _payload/_deploy.php

          ls -la _payload

      - name: FTP-upload the payload (3 small files) to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /public_html/
          local-dir: ./_payload/
          state-name: .ftp-deploy-payload-state.json

      - name: Extract on the server
        run: |
          set -e
          base="${{ secrets.APP_BASE_URL }}"
          base="${base:-https://pestone.co.ke}"
          curl -fsS "$base/_deploy.php?token=${{ secrets.DEPLOY_TOKEN }}"

      - name: Run migrate / seed / cache
        run: |
          base="${{ secrets.APP_BASE_URL }}"
          base="${base:-https://pestone.co.ke}"
          curl -fsS "$base/deploy/${{ secrets.DEPLOY_TOKEN }}" || echo "Not reachable yet — expected before .env exists on the server."
